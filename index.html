<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palermas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #000; font-family: 'Arial', sans-serif; font-weight: 300; overflow-x: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; user-select: none; }
        .screen { position: absolute; width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; transition: transform 0.8s ease, opacity 0.8s ease; opacity: 1; }
        .screen.slide-from-right { transform: translateX(100%); }
        .screen.active { transform: translateX(0); opacity: 1; }
        .screen.fade-out { opacity: 0; pointer-events: none; }
        
        #story-screen { display: none; flex-direction: column; justify-content: flex-start; align-items: flex-start; padding: 40px; z-index: 50; width: 100%; max-width: 800px; cursor: pointer; }
        #story-screen.show { display: flex; }
        #story-text { font-family: 'Courier New', Courier, monospace; font-size: 1.2rem; line-height: 1.6; white-space: pre-wrap; min-height: 100px; }
        
        /* Indicador de Próximo Texto (Seta Piscando) */
        #next-indicator {
            display: none;
            color: #fff;
            font-size: 1.5rem;
            margin-top: 10px;
            animation: bounce 1s infinite;
            align-self: flex-end; /* Fica no canto direito do texto */
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(5px); opacity: 0.5; }
        }

        #chapter-title { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: 'Courier New', Courier, monospace; font-size: 2rem; text-align: center; opacity: 0; transition: opacity 1.5s ease; z-index: 60; pointer-events: none; }
        #chapter-title.visible { opacity: 1; }
        
        #options-container { display: none; flex-direction: column; gap: 15px; margin-top: 30px; width: 100%; opacity: 0; transition: opacity 0.5s ease; }
        #options-container.visible { display: flex; opacity: 1; }
        
        .option-btn { background: transparent; border: 1px solid #444; border-left: 4px solid #fff; color: #ccc; padding: 15px 20px; text-align: left; font-family: 'Courier New', Courier, monospace; font-size: 1rem; cursor: pointer; transition: all 0.2s ease; }
        .option-btn:hover { background: #fff; color: #000; border-color: #fff; padding-left: 30px; }
        .option-btn.locked { opacity: 0.3; cursor: not-allowed; border-left: 4px solid #444; text-decoration: line-through; color: #666; pointer-events: none; }
        
        #continue-btn { display: none; margin-top: 30px; background-color: transparent; color: #fff; border: 1px solid #fff; padding: 10px 30px; font-family: 'Courier New', Courier, monospace; cursor: pointer; align-self: flex-start; }
        #continue-btn:hover { background-color: #fff; color: #000; }
        
        /* Botão de Resetar Save */
        .reset-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid #444;
            color: #666;
            font-size: 0.8rem;
            padding: 5px 10px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }
        .reset-btn:hover { border-color: #f00; color: #f00; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.95); justify-content: center; align-items: center; z-index: 1000; }
        .modal.show { display: flex; }
        .modal-content { display: flex; flex-direction: column; align-items: center; gap: 30px; }
        .modal-title { color: #fff; font-size: 1.5rem; font-weight: 300; letter-spacing: 0.1em; }
        .code-input { background-color: transparent; color: #fff; border: 1px solid #fff; padding: 15px 30px; font-size: 1.5rem; font-weight: 300; text-align: center; letter-spacing: 0.3em; text-transform: uppercase; width: 300px; }
        .code-input:focus { outline: none; background-color: rgba(255, 255, 255, 0.1); }
        .modal-buttons { display: flex; gap: 15px; }
        .modal-btn { background-color: transparent; color: #fff; border: 1px solid #fff; padding: 10px 30px; font-size: 1rem; font-weight: 300; cursor: pointer; transition: all 0.3s ease; letter-spacing: 0.05em; }
        .modal-btn:hover { background-color: #fff; color: #000; }
        .modal-close { border-color: #555; color: #aaa; }
        .modal-close:hover { background-color: #333; color: #fff; border-color: #333; }
        
        #initial-screen { flex-direction: column; transition: transform 0.8s ease, opacity 0.8s ease; }
        #initial-screen.slide-left { transform: translateX(-40%); }
        .title-container { display: flex; flex-direction: column; align-items: center; }
        h1 { color: #fff; font-size: 4rem; font-weight: 300; margin-bottom: 3rem; letter-spacing: 0.1em; }
        .btn { background-color: transparent; color: #fff; border: 1px solid #fff; padding: 15px 50px; font-size: 1.2rem; font-weight: 300; cursor: pointer; transition: all 0.3s ease; letter-spacing: 0.05em; }
        .btn:hover { background-color: #fff; color: #000; }
        
        #selection-screen { flex-direction: column; gap: 20px; }
        .player-btn { background-color: transparent; color: #fff; border: 1px solid #fff; padding: 20px 80px; font-size: 1.5rem; font-weight: 300; cursor: pointer; transition: all 0.3s ease; letter-spacing: 0.05em; min-width: 300px; position: relative; }
        .player-btn:hover { background-color: #fff; color: #000; }
        .player-btn.unlocked::after { content: ''; position: absolute; right: 30px; top: 50%; transform: translateY(-50%); width: 8px; height: 8px; background-color: #fff; border-radius: 50%; transition: background-color 0.3s ease; }
        .player-btn.unlocked:hover::after { background-color: #000; }
        
        .player-btn.locked-char { opacity: 0.3; cursor: not-allowed; border-color: #444; color: #666; pointer-events: none; }
        .player-btn.finished { opacity: 0.5; text-decoration: line-through; border-color: #555; color: #555; cursor: default; pointer-events: none; }
        .player-btn.finished::after { display: none; }
        
        /* Estilo especial para o Gabriel */
        #btn-gabriel { display: none; } 
        #btn-gabriel.unlocked { border-color: #ff4444; color: #ff4444; }
        #btn-gabriel.unlocked:hover { background-color: #ff4444; color: #000; }
        #btn-gabriel.unlocked::after { background-color: #ff4444; }

        .player-btn[data-tooltip]:hover::before { content: attr(data-tooltip); position: absolute; top: -40px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 5px 10px; font-size: 0.8rem; font-weight: bold; border-radius: 0; white-space: nowrap; opacity: 1; pointer-events: none; border: 1px solid #000; }
        .player-btn[data-tooltip]:hover::after { content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); border-width: 5px; border-style: solid; border-color: #fff transparent transparent transparent; }
        .player-btn.unlocked[data-tooltip]:hover::after { content: ''; position: absolute; right: 30px; top: 50%; left: auto; transform: translateY(-50%); width: 8px; height: 8px; background-color: #000; border-radius: 50%; border: none; }
        
        .help-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background-color: transparent; color: #fff; border: 1px solid #fff; border-radius: 50%; font-size: 2rem; font-weight: 300; cursor: pointer; transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; }
        .help-btn:hover { background-color: #fff; color: #000; }
        .back-btn { position: fixed; top: 30px; left: 30px; background-color: transparent; color: #fff; border: 1px solid #fff; padding: 10px 30px; font-size: 1rem; font-weight: 300; cursor: pointer; transition: all 0.3s ease; letter-spacing: 0.05em; }
        .back-btn:hover { background-color: #fff; color: #000; }
        
        .skip-hint { position: fixed; bottom: 10px; right: 10px; color: #444; font-size: 0.8rem; font-family: 'Courier New', Courier, monospace; pointer-events: none; opacity: 0.5; }
        
        .bubble-67 { position: fixed; bottom: -50px; color: #ffeb3b; font-family: 'Courier New', monospace; font-weight: bold; pointer-events: none; z-index: 9999; animation: floatUp 4s linear forwards; }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>
    <div id="initial-screen" class="screen active">
        <div class="title-container">
            <h1>Palermas</h1>
            <button class="btn" onclick="prosseguir()">Prosseguir</button>
        </div>
    </div>

    <div id="selection-screen" class="screen slide-from-right">
        <button class="back-btn" onclick="voltar()">Voltar</button>
        
        <!-- Botão de Resetar Save -->
        <button class="reset-btn" onclick="resetarSave()">Apagar Save</button>

        <button id="btn-ericky" class="player-btn unlocked" onclick="iniciarHistoria('ericky')">Ericky</button>
        <button id="btn-leo" class="player-btn locked-char" onclick="iniciarHistoria('leo')">Leo</button> 
        <button id="btn-gabriel" class="player-btn locked-char" onclick="iniciarHistoria('gabriel')">Gabriel</button>
        <button id="btn-isaque" class="player-btn locked-char" data-tooltip="Em produção">Isaque</button>
        <button id="btn-vitor" class="player-btn locked-char" data-tooltip="Em produção">Vitor</button>
        <button class="help-btn" onclick="abrirModal()">?</button>
    </div>

    <div id="chapter-title"></div>

    <div id="story-screen" class="screen">
        <div id="story-text"></div>
        <div id="next-indicator">▼</div>
        <div id="options-container"></div>
        <button id="continue-btn">Continuar</button>
        <div class="skip-hint">Clique ou [→] para avançar</div>
    </div>

    <div id="code-modal" class="modal">
        <div class="modal-content">
            <h2 class="modal-title">Insira o código</h2>
            <input type="text" id="secret-code-input" class="code-input" maxlength="10" placeholder="_ _ _ _ _ _ _">
            <div class="modal-buttons">
                <button class="modal-btn" onclick="verificarCodigo()">Confirmar</button>
                <button class="modal-btn modal-close" onclick="fecharModal()">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let audioEnabled = false;
        function initAudio() { if (audioCtx.state === 'suspended') { audioCtx.resume().then(() => { audioEnabled = true; }); } else { audioEnabled = true; } }
        function playTone(freq, type, duration, vol = 0.05) { if (!audioEnabled) return; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime); gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration); }
        function sfxChapter() { if (!audioEnabled) return; const now = audioCtx.currentTime; [110, 164.8, 220].forEach((f, i) => { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'sawtooth'; osc.frequency.value = f; gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.15 - (i*0.03), now + 0.5); gain.gain.exponentialRampToValueAtTime(0.001, now + 3.0); const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 800; osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 3.0); }); }
        function sfxType() { playTone(800 + Math.random() * 100, 'square', 0.03, 0.02); }
        function sfxClick() { playTone(400, 'sine', 0.1, 0.05); }
        function sfxThud() { if (!audioEnabled) return; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2); gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3); }

        // --- META GAME & PERSISTÊNCIA ---
        const SAVE_KEY = 'palermas_save_data';

        let metaGame = {
            erickyJogou: false,
            erickyPegouIsqueiro: false,
            erickyPegouFerro: false, 
            erickyAjudouLeo: false, 
            erickyViuCratera: false,
            leoDesbloqueado: false,
            leoJogou: false,
            codigoCassinoAtivo: false,
            erickyEntrouClube5: false
        };

        function salvarProgresso() {
            localStorage.setItem(SAVE_KEY, JSON.stringify(metaGame));
        }

        function resetarSave() {
            sfxClick();
            if(confirm("Tem certeza? Isso apagará todo o seu progresso no jogo e reiniciará a página.")) {
                localStorage.removeItem(SAVE_KEY);
                location.reload();
            }
        }

        function carregarProgresso() {
            const saved = localStorage.getItem(SAVE_KEY);
            if (saved) {
                try {
                    const loaded = JSON.parse(saved);
                    metaGame = { ...metaGame, ...loaded };
                    atualizarInterfaceMenu();
                } catch (e) {
                    console.error("Erro save", e);
                }
            }
        }

        function atualizarInterfaceMenu() {
            const btnEricky = document.getElementById('btn-ericky');
            const btnLeo = document.getElementById('btn-leo');
            const btnGabriel = document.getElementById('btn-gabriel');

            if (metaGame.erickyJogou) {
                btnEricky.classList.remove('unlocked');
                btnEricky.classList.add('finished');
                btnEricky.onclick = null;
            }

            if (metaGame.leoDesbloqueado) {
                if (metaGame.leoJogou) {
                    btnLeo.classList.remove('locked-char', 'unlocked');
                    btnLeo.classList.add('finished');
                    btnLeo.onclick = null;
                } else {
                    btnLeo.classList.remove('locked-char');
                    btnLeo.classList.add('unlocked');
                }
            } else {
                btnLeo.classList.add('locked-char');
                btnLeo.classList.remove('unlocked');
            }

            if (metaGame.codigoCassinoAtivo) {
                btnGabriel.style.display = 'inline-block';
                if (metaGame.erickyJogou && metaGame.leoJogou) {
                    btnGabriel.classList.remove('locked-char');
                    btnGabriel.classList.add('unlocked');
                }
            }
        }

        window.onload = () => { 
            carregarProgresso(); 
        };

        // --- ESTADO DA SESSÃO ATUAL ---
        let gameState = {
            inventario: [],
            experienciaCombate: 0,
            conhecimentoEngenharia: 0,
            saude: 100,
            paranoia: false,
            leoSalvo: false,
            leoStatus: 'normal',
            quartoVasculhado: false,
            relacionamentoLeo: 0,
            erickyFinalizado: false,
            phellipeVisitou2Andar: false,
            nightActions: { teclado: false, baseado: false } 
        };

        function prosseguir() { initAudio(); sfxClick(); document.getElementById('initial-screen').classList.add('slide-left'); document.getElementById('selection-screen').classList.add('active'); }
        function voltar() { sfxClick(); document.getElementById('initial-screen').classList.remove('slide-left'); document.getElementById('selection-screen').classList.remove('active'); }
        
        function abrirModal() { sfxClick(); document.getElementById('code-modal').classList.add('show'); document.getElementById('secret-code-input').focus(); }
        function fecharModal() { sfxClick(); document.getElementById('code-modal').classList.remove('show'); }
        
        function verificarCodigo() {
            sfxClick();
            const input = document.getElementById('secret-code-input');
            const codigo = input.value.toUpperCase().trim();
            
            if (codigo === "CASSINO") { 
                alert("Segredo Revelado: Rota de Gabriel visível");
                metaGame.codigoCassinoAtivo = true;
                salvarProgresso();
                atualizarInterfaceMenu();
                fecharModal();
            } else if (codigo === "LIBERAR") { 
                alert("CHEAT: Tudo Liberado");
                metaGame.erickyJogou = true;
                metaGame.leoJogou = true;
                metaGame.leoDesbloqueado = true;
                salvarProgresso();
                atualizarInterfaceMenu();
                fecharModal();
            } else if (codigo === "67") {
                trigger67Joke();
            } else { 
                alert("Código Inválido"); input.value = ""; input.focus(); 
            }
        }

        function trigger67Joke() {
            fecharModal();
            const count = 50; 
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const b = document.createElement('div');
                    b.className = 'bubble-67';
                    b.textContent = '67';
                    b.style.left = Math.random() * 100 + 'vw';
                    b.style.fontSize = (Math.random() * 2 + 1) + 'rem';
                    b.style.animationDuration = (Math.random() * 2 + 3) + 's'; 
                    document.body.appendChild(b);
                    setTimeout(() => b.remove(), 5000);
                }, Math.random() * 2000);
            }
        }

        document.getElementById('secret-code-input').addEventListener('keypress', function (e) { if (e.key === 'Enter') verificarCodigo(); });
        document.getElementById('code-modal').addEventListener('click', function(e) { if (e.target === this) fecharModal(); });

        // --- SISTEMA DE DIGITAÇÃO E AVANÇO MANUAL ---
        let typingState = { timer: null, text: '', element: null, fn: null, active: false, waiting: false };

        function digitarTexto(texto, elemento, callback) {
            // Se já estiver esperando, ignora (ou resolve o anterior se for chamado forçado)
            if (typingState.active) {
                clearTimeout(typingState.timer);
                if (typingState.element) typingState.element.textContent = typingState.text;
            }

            // Limpa indicador anterior se houver
            document.getElementById('next-indicator').style.display = 'none';
            typingState.waiting = false;

            typingState.active = true;
            typingState.text = texto;
            typingState.element = elemento;
            typingState.fn = callback;

            elemento.textContent = ''; // Limpa texto anterior visualmente se for novo bloco

            let i = 0;
            const parteLenta = "e . . .";
            const indexInicioLento = texto.indexOf(parteLenta);

            function type() {
                if (!typingState.active) return;

                if (i < texto.length) {
                    const char = texto.charAt(i);
                    elemento.textContent += char;
                    if (char !== ' ' && char !== '\n') sfxType();
                    i++;
                    let delay = 30;
                    if (indexInicioLento !== -1 && i >= indexInicioLento) delay = 200;
                    if (texto.charAt(i-1) === '.') delay += 150;
                    typingState.timer = setTimeout(type, delay);
                } else {
                    // Terminou de digitar
                    typingState.active = false;
                    // Se tiver callback (próxima ação), espera input
                    if (callback) {
                        typingState.waiting = true;
                        document.getElementById('next-indicator').style.display = 'block';
                    }
                }
            }
            type();
        }

        // Listener Global para Avançar
        function handleInteraction() {
            if (typingState.active) {
                // Pular digitação
                clearTimeout(typingState.timer);
                if (typingState.element) typingState.element.textContent = typingState.text;
                typingState.active = false;
                
                // Se tiver callback, agora espera o próximo clique para continuar
                if (typingState.fn) {
                    typingState.waiting = true;
                    document.getElementById('next-indicator').style.display = 'block';
                }
            } else if (typingState.waiting) {
                // Avançar para o próximo bloco
                sfxClick(); // Som de confirmação
                typingState.waiting = false;
                document.getElementById('next-indicator').style.display = 'none';
                if (typingState.fn) {
                    const nextFn = typingState.fn;
                    typingState.fn = null; // Limpa para evitar loops
                    nextFn();
                }
            }
        }

        // Interação via Clique na tela de história
        document.getElementById('story-screen').addEventListener('click', handleInteraction);
        
        // Interação via Teclado (Qualquer tecla ou Seta Direita)
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('story-screen').classList.contains('show')) {
                handleInteraction();
            }
        });

        // --- LÓGICA DO JOGO ---

        function iniciarHistoria(personagem) {
            initAudio(); sfxClick();
            if (personagem === 'ericky' && gameState.erickyFinalizado) return;
            if (personagem === 'leo' && !metaGame.leoDesbloqueado) return;
            if (personagem === 'gabriel' && (!metaGame.erickyJogou || !metaGame.leoJogou)) return;

            gameState = { inventario: [], experienciaCombate: 0, conhecimentoEngenharia: 0, saude: 100, paranoia: false, leoSalvo: false, leoStatus: 'normal', quartoVasculhado: false, relacionamentoLeo: 0, erickyFinalizado: gameState.erickyFinalizado, phellipeVisitou2Andar: false, nightActions: { teclado: false, baseado: false } };

            const storyText = document.getElementById('story-text');
            const optionsContainer = document.getElementById('options-container');
            storyText.textContent = '';
            optionsContainer.innerHTML = '';
            optionsContainer.classList.remove('visible');
            document.getElementById('continue-btn').style.display = 'none';
            document.getElementById('selection-screen').classList.add('fade-out');
            document.getElementById('initial-screen').classList.add('fade-out');

            setTimeout(() => {
                document.getElementById('selection-screen').style.display = 'none';
                document.getElementById('initial-screen').style.display = 'none';
                document.getElementById('story-screen').classList.add('show');
                
                if (personagem === 'ericky') iniciarRotaEricky();
                else if (personagem === 'leo') iniciarRotaLeo();
                else if (personagem === 'gabriel') {
                    digitarTexto("A rota de Gabriel começa aqui... (Em breve)", storyText, () => {
                        const btn = document.getElementById('continue-btn');
                        btn.textContent = "Voltar";
                        btn.style.display = 'block';
                        btn.onclick = () => location.reload();
                    });
                }
            }, 800);
        }

        function mostrarTituloCapitulo(titulo, callback) {
            const chapterTitle = document.getElementById('chapter-title');
            chapterTitle.textContent = titulo;
            sfxChapter();
            chapterTitle.classList.add('visible');
            // Timeout reduzido pois o jogador pode pular
            setTimeout(() => { chapterTitle.classList.remove('visible'); callback(); }, 2500);
        }

        // ==================== ROTA DO ERICKY =======================
        function iniciarRotaEricky() {
            const storyText = document.getElementById('story-text');
            const intro = `.\n3 meses depois do Primeiro Estrondo\nEricky perdeu os pais no primeiro colapso.\n\nAgora vaga sozinho por Manaus com:\num cantil\num pano ensanguentado\numa foto rasgada\ne . . .\n\num baseado`;
            digitarTexto(intro, storyText, () => {
                storyText.textContent = ''; 
                mostrarTituloCapitulo("CAPÍTULO 1 — “Entre Ruas Vazias”", () => { 
                    digitarTexto("Ericky está próximo ao Baratão da Carne, procurando comida.", storyText, () => { 
                        mostrarOpcoesIniciaisEricky(); 
                    }); 
                });
            });
        }

        function mostrarOpcoesIniciaisEricky() {
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = `
                <button class="option-btn" onclick="escolherOpcaoEricky('A')">A. Mercado saqueado</button>
                <button class="option-btn" onclick="escolherOpcaoEricky('B')">B. Ônibus 640 tombado</button>
                <button class="option-btn" onclick="escolherOpcaoEricky('C')">C. T4</button>
            `;
            optionsContainer.classList.add('visible');
        }

        function escolherOpcaoEricky(escolha) {
            sfxClick();
            const optionsContainer = document.getElementById('options-container');
            const storyText = document.getElementById('story-text');
            const continueBtn = document.getElementById('continue-btn');
            optionsContainer.classList.remove('visible');
            
            // Pequeno delay para limpar
            setTimeout(() => {
                storyText.textContent = '';
                let txt = "";

                    });
                } else {
                    digitarTexto("\n\nNinguém vem ajudar. Os bandidos espancam Leo até cansarem e vão embora.\nLeo desmaia.", storyText, () => {
                        setTimeout(leoBiblioteca, 4000);
                    });
                }
            }, 3000);
        }

        function leoBiblioteca() {
            const storyText = document.getElementById('story-text');
            storyText.textContent = "";
            digitarTexto("Leo acorda confuso, ainda em choque, molhado pela chuva que estava acontecendo, era noite.\n\nLeo adentra uma biblioteca e lá se instala.", storyText, mostrarOpcoesBiblioteca);
        }

        function mostrarOpcoesBiblioteca() {
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = `
                <p style="margin-bottom: 10px; color: #888;">Ler livros sobre:</p>
                <button class="option-btn" onclick="escolhaLivroLeo('engenharia')">Engenharia</button>
                <button class="option-btn" onclick="escolhaLivroLeo('luta')">Luta</button>
                <button class="option-btn" onclick="escolhaLivroLeo('culinaria')">Culinária</button>
            `;
            optionsContainer.classList.add('visible');
        }

        function escolhaLivroLeo(tipo) {
            sfxClick();
            const optionsContainer = document.getElementById('options-container');
            const storyText = document.getElementById('story-text');
            optionsContainer.classList.remove('visible');
            storyText.textContent = "";
            
            if (tipo === 'luta') gameState.experienciaCombate += 2;
            if (tipo === 'engenharia') gameState.conhecimentoEngenharia += 2;

            digitarTexto("Leo passa o tempo lendo e sobrevivendo.\n\n3 MESES SE PASSAM.", storyText, () => {
                setTimeout(leoTimeJump, 3000);
            });
        }

        function leoTimeJump() {
            const storyText = document.getElementById('story-text');
            storyText.textContent = "";
            digitarTexto("Leo, passou 3 meses tentando sobreviver, procurando comida, fugindo de pessoas mal intencionadas, durante esse tempo leo achou um caminhão cheio de latas, que lhe proporcionou ficar em casa sem precisar saquear por 2 meses.\n\nAgora, tudo tinha acabado.\nLeo precisava achar comida.", storyText, mostrarInvasaoMercado);
        }

        function mostrarInvasaoMercado() {
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = `
                <button class="option-btn" onclick="invasaoMercado('janela')">Quebrar janela</button>
                <button class="option-btn" onclick="invasaoMercado('porta')">Arrombar porta</button>
            `;
            optionsContainer.classList.add('visible');
        }

        function invasaoMercado(metodo) {
            sfxClick();
            const optionsContainer = document.getElementById('options-container');
            const storyText = document.getElementById('story-text');
            optionsContainer.classList.remove('visible');
            storyText.textContent = "";

            if (metodo === 'porta') {
                if (Math.random() > 0.5) digitarTexto("A porta não cede. Leo quebra a janela.", storyText, () => entradaMercado(true));
                else digitarTexto("A porta cede.", storyText, () => entradaMercado(false));
            } else {
                digitarTexto("Leo quebra o vidro.", storyText, () => entradaMercado(true));
            }
        }

        function entradaMercado(ferido) {
            const storyText = document.getElementById('story-text');
            if (ferido) gameState.saude -= 10;
            setTimeout(() => {
                digitarTexto("\n\nAo entrar, começa a saquear, bastante coisa, água, comida.\nSem querer Leo derruba uma lata.\n\n'Acho que ninguém ouviu'.\n\nDE REPENTE!", storyText, () => {
                    if (metaGame.erickyEntrouClube5) {
                        // SE ERICKY ESTÁ NO CLUBE 5 -> ELE NÃO ESTÁ AQUI
                        setTimeout(leoEncontraCelular, 2000);
                    } else {
                        // ROTA PADRÃO -> ERICKY ATACA
                        setTimeout(leoCapitulo4Final, 2000);
                    }
                });
            }, 1000);
        }

        // --- ROTA PADRÃO (FIGHT) ---
        function leoCapitulo4Final() {
            const storyText = document.getElementById('story-text');
            storyText.textContent = "";
            mostrarTituloCapitulo("CAPÍTULO 4 — “Inimigos ou Amigos?”", () => {
                digitarTexto("Alguém surge e ataca Leo! É um homem jovem (Ericky).", storyText, iniciarCombateLeo);
            });
        }

        function iniciarCombateLeo() {
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = `
                <button class="option-btn" onclick="combateLeoRound1()">Contra-atacar</button>
                <button class="option-btn" onclick="combateLeoRound1()">Esquivar</button>
            `;
            optionsContainer.classList.add('visible');
        }

        function combateLeoRound1() {
            sfxClick();
            const optionsContainer = document.getElementById('options-container');
            const storyText = document.getElementById('story-text');
            optionsContainer.classList.remove('visible');
            storyText.textContent = "";
            digitarTexto("Leo prevê o movimento. Bloqueia e derruba o garoto.", storyText, finalLeo);
        }

        function finalLeo() {
            const continueBtn = document.getElementById('continue-btn');
            const storyText = document.getElementById('story-text');
            setTimeout(() => {
                digitarTexto("\n\nLeo tira a máscara. O garoto o reconhece.\nEricky deixa Leo numa parte improvisada pra dormir.\n\nLeo agradece e pensa que finalmente achou alguém que parece confiável.", storyText, () => {
                    continueBtn.textContent = "Fim da Parte 2";
                    continueBtn.style.display = 'block';
                    continueBtn.onclick = fimDeJogoLeo;
                });
            }, 2000);
        }

        // --- NOVA ROTA (CELULAR) ---
        function leoEncontraCelular() {
            const storyText = document.getElementById('story-text');
            storyText.textContent = "";
            
            digitarTexto("Ninguém apareceu. O silêncio continua.\n\nLeo termina de saquear.\nQuando está saindo, vê um celular tocando no chão da loja.", storyText, mostrarOpcoesCelular);
        }

        function mostrarOpcoesCelular() {
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = `
                <button class="option-btn" onclick="leoAtenderTelefone()">Atender</button>
                <button class="option-btn" onclick="leoRecusarTelefone()">Ignorar e sair</button>
            `;
            optionsContainer.classList.add('visible');
        }

        function leoRecusarTelefone() {
            sfxClick();
            const storyText = document.getElementById('story-text');
            document.getElementById('options-container').classList.remove('visible');
            storyText.textContent = "";
            
            digitarTexto("Leo ignora o telefone.\n\n— Tenho mais o que fazer. — diz ele.\n\nSai da loja e some na escuridão.\n\nFIM DA PARTE 2", storyText, () => {
                const continueBtn = document.getElementById('continue-btn');
                continueBtn.textContent = "Voltar ao Menu";
                continueBtn.style.display = 'block';
                continueBtn.onclick = fimDeJogoLeo;
            });
        }

        function leoAtenderTelefone() {
            sfxClick();
            const storyText = document.getElementById('story-text');
            document.getElementById('options-container').classList.remove('visible');
            storyText.textContent = "";
            
            digitarTexto("Leo atende.\n\n— Leo? — diz uma voz misteriosa.\n\n— Quem é? A gente se conhece? — pergunta Leo.\n\n— Ainda não. — responde a voz.\n\n— Você quer fazer parte de algo maior?", storyText, leoDecisaoProposta);
        }

        function leoDecisaoProposta() {
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = `
                <button class="option-btn" onclick="leoAceitarProposta()">Aceitar</button>
                <button class="option-btn" onclick="leoRecusarProposta()">Recusar</button>
            `;
            optionsContainer.classList.add('visible');
        }

        function leoAceitarProposta() {
            sfxClick();
            const storyText = document.getElementById('story-text');
            document.getElementById('options-container').classList.remove('visible');
            storyText.textContent = "";
            
            digitarTexto("— Estou ouvindo. — diz Leo.\n\n— Esteja no Platão amanhã de manhã. Não se atrase.\n\nLeo desliga e sai da loja, sem saber o que o espera.\n\nFIM DA PARTE 2", storyText, () => {
                const continueBtn = document.getElementById('continue-btn');
                continueBtn.textContent = "Voltar ao Menu";
                continueBtn.style.display = 'block';
                continueBtn.onclick = fimDeJogoLeo;
            });
        }

        function leoRecusarProposta() {
            sfxClick();
            const storyText = document.getElementById('story-text');
            document.getElementById('options-container').classList.remove('visible');
            storyText.textContent = "";
            
            digitarTexto("— Eu trabalho sozinho. — diz Leo e desliga.\n\nSai da loja sem olhar para trás.\n\nFIM DA PARTE 2", storyText, () => {
                const continueBtn = document.getElementById('continue-btn');
                continueBtn.textContent = "Voltar ao Menu";
                continueBtn.style.display = 'block';
                continueBtn.onclick = fimDeJogoLeo;
            });
        }

        function fimDeJogoLeo() {
            sfxClick();
            document.getElementById('story-screen').classList.remove('show');
            metaGame.leoJogou = true;
            salvarProgresso();
            atualizarInterfaceMenu();

            const sel = document.getElementById('selection-screen');
            sel.style.display = 'flex';
            setTimeout(() => sel.classList.remove('fade-out'), 100);
        }
    </script>
</body>
</html>
